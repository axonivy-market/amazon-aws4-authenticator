name: E2E-Build

on:
  schedule:
    - cron:  '0 1 * * 1'
  workflow_dispatch:
  
permissions:
  contents: read
  checks: write

jobs:
  build:
    uses: axonivy-market/github-workflows/.github/workflows/ci.yml@v6
    secrets:
      mvnArgs: >-
        -P e2e
        -DAWS_ACCESS_KEY=${{ secrets.AWS_ACCESS_KEY }}
        -DAWS_SECRET_KEY=${{ secrets.AWS_SECRET_KEY }}